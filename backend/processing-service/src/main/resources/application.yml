spring:
  application:
    name: PROCESSING-SERVICE
  data:
    mongodb:
      uri: mongodb://localhost:27017/simplymusic
  rabbitmq:
    host: localhost
    port: 5672

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: music

server:
  port: 8084

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
