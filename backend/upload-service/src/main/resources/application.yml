spring:
  application:
    name: UPLOAD-SERVICE
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/simplymusic/protocol/openid-connect/certs
  rabbitmq:
    host: localhost
    port: 5672

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: music

server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

